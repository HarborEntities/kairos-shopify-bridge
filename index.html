<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kairos Operator Bridge</title>
  <meta name="shopify-api-key" content="8716255ddaa42a019b94ee26481a7864" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; max-width: 800px; margin: 0 auto; color: #202223; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .info { padding: 12px 16px; border-radius: 6px; background: #f6f6f7; margin: 12px 0; font-size: 14px; line-height: 1.5; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    .token-box { padding: 16px; border-radius: 6px; background: #202223; color: #e3e3e3; font-family: monospace; font-size: 11px; word-break: break-all; margin: 12px 0; line-height: 1.4; max-height: 200px; overflow: auto; user-select: all; }
    .meta { font-size: 12px; color: #6d7175; margin-top: 8px; }
    button { padding: 10px 16px; background: #008060; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #006e52; }
  </style>
</head>
<body>
  <h1>Kairos Operator, session token bridge</h1>
  <div id="result"></div>

  <script>
    const result = document.getElementById("result");

    function el(tag, props, ...kids) {
      const e = document.createElement(tag);
      if (props) Object.assign(e, props);
      for (const k of kids) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
      return e;
    }

    const params = new URLSearchParams(window.location.search);
    const idToken = params.get("id_token");
    const shop = params.get("shop");
    const host = params.get("host");

    if (!idToken) {
      const e = el("div", { className: "info err" });
      e.appendChild(el("strong", null, "No id_token in URL."));
      e.appendChild(el("br"));
      e.appendChild(document.createTextNode("This page must be loaded from inside the Shopify admin (Apps menu, click Kairos Operator). If you opened the GitHub Pages URL directly, that will not work."));
      result.appendChild(e);
    } else {
      const ok = el("div", { className: "info ok" });
      ok.appendChild(el("strong", null, "Session token captured."));
      ok.appendChild(el("br"));
      ok.appendChild(document.createTextNode("Copy the value below and paste it to Kairos. Token is valid for 60 seconds, exchange must happen fast."));
      result.appendChild(ok);

      const tokenBox = el("div", { className: "token-box", id: "tokenBox" }, idToken);
      result.appendChild(tokenBox);

      const meta = el("div", { className: "meta" });
      meta.appendChild(document.createTextNode("Shop: " + (shop || "unknown") + " | Host: " + (host || "unknown") + " | Captured at: " + new Date().toISOString()));
      result.appendChild(meta);

      const btn = el("button", null, "Copy token to clipboard");
      btn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(idToken);
          btn.textContent = "Copied! Paste to Kairos now";
          btn.style.background = "#006e52";
        } catch (e) {
          // fallback: select the text
          const range = document.createRange();
          range.selectNodeContents(tokenBox);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          btn.textContent = "Selected, press Ctrl+C / Cmd+C";
        }
      };
      result.appendChild(btn);
    }
  </script>
</body>
</html>
